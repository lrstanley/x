# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  main:
    taskfile: ../../Taskfile.yaml
    flatten: true

vars:
  WASM2GO: github.com/ncruces/wasm2go@v0.4.19
  IMAGE: term-vt-zig:0.16.0
  WASM: internal/wasmvt/ghostty-vt.wasm

tasks:
  generate:
    desc: rebuild the libghostty-vt wasm module and abi constants
    deps: [image]
    cmds:
      - >-
        bash -o pipefail -c 'docker run --rm {{.IMAGE}} | (cd internal/wasmvt && go run {{.WASM2GO}} -unsafe -nanbox -pkg wasmvt -o vt.generated.go)'
      - sed -i '1s/.*/\/\/ Code generated. DO NOT EDIT./' internal/wasmvt/vt.generated.go
      - GOWORK=off go run ./cmd/genabi
  image:
    desc: build the zig image that writes ghostty-vt.wasm to stdout
    cmds:
      - docker build -t {{.IMAGE}} -f build/Dockerfile build
  wasm2go:
    desc: translate a local ghostty-vt.wasm and regenerate abi constants
    preconditions:
      - sh: test -f {{.WASM}}
        msg: "missing {{.WASM}}"
    cmds:
      - |
        cd internal/wasmvt \
          && go run {{.WASM2GO}} -unsafe -nanbox -pkg wasmvt -o vt.generated.go ghostty-vt.wasm
      - sed -i '1s/.*/\/\/ Code generated. DO NOT EDIT./' internal/wasmvt/vt.generated.go
      - GOWORK=off go run ./cmd/genabi
